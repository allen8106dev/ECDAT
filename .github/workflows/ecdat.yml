name: ECDAT scan and validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ecdat/requirements.txt
      - run: python -m unittest discover -s ecdat -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build && npm run lint && node --test src/uploads.test.mjs
        working-directory: dashboard

  scan-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ecdat/requirements.txt
      - run: python ecdat/cli.py . --output ecdat-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecdat-report
          path: ecdat-report.json
